<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
</head>
<body>
    <div class="div-content"> 
        <div id="header-container", class="div-tittle">
            <h1>Bienvenido al juego del ahorcado</h1>
        </div>

        <div id="juego-container", class="div-container">
            <span class="label">Nombre del Jugador</span>
            <input class="input-nombre"
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre..."
                maxlength="20"
            />
            <p id="error" style="display:none; color:#f87171; font-size:0.85rem;">
                Por favor ingresa tu nombre primero.
            </p>

            <h1>Selecciona la dificultad</h1>

                
                <button id="button_easy" class="btn" onclick="GameStart('easy')">Fácil</button>

                <button id="button_medium" class="btn">Medio</button>

                <button id="button_hard" class="btn">Difícil</button>

            
        </div>
    </div>
    
    <script src="src/js/menu.js"></script>
</body>
</html>
